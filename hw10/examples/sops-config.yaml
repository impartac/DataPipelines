creation_rules:
  - path_regex: environments/prod/.*\.ya?ml$
    key_groups:
    - kms:
      - arn: arn:aws:kms:eu-central-1:123456789012:key/mrk-abc123def456abc123
        aws_profile: production
        role: arn:aws:iam::123456789012:role/sops-production
      age:
      - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8
    shamir_threshold: 1

  - path_regex: environments/staging/.*\.ya?ml$
    key_groups:
    - kms:
      - arn: arn:aws:kms:eu-central-1:123456789012:key/mrk-def456abc789def456
        aws_profile: staging
    - age:
      - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8
    shamir_threshold: 2

  - path_regex: environments/dev/.*\.ya?ml$
    age:
    - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8
    - age1lggyhqrcg4jxkq6vo5jf2k4wmevcl5fxu5e4p9zrjqx7jkl7zrqd3xn5p

  - path_regex: environments/gcp/.*\.ya?ml$
    gcp_kms:
    - resource_id: projects/my-project/locations/europe-west1/keyRings/sops/cryptoKeys/prod

  - path_regex: helm/.*values.*\.ya?ml$
    encrypted_regex: "^(password|secret|key|token|credentials)$"
    age:
    - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8

  - path_regex: terraform/.*\.tfvars$
    age:
    - age1ql3z7hjy54pw3hyww5ayyfg7zqgvc7w3j2elw8zmrj2kg5sfn9aqmcac8
