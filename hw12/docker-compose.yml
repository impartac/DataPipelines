# =============================================================================
# docker-compose.yml — Local CI/CD Demo Environment
# =============================================================================
# Сервисы:
#   registry        — локальный Docker Registry (как GitLab Registry)
#   minio           — S3-хранилище артефактов (как в продакшне)
#   spark-processor — Spark ETL job (собираем и запускаем локально)
#   data-ui         — Dashboard (nginx + static HTML)
# =============================================================================

version: "3.9"

services:

  # ── Local Docker Registry ─────────────────────────────────────────────────
  # Эмулирует GitLab Container Registry
  # Адрес: localhost:5000
  registry:
    image: registry:2
    container_name: local-registry
    ports:
      - "5000:5000"
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /data
    volumes:
      - registry_data:/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:5000/v2/"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - pipeline-net

  # ── MinIO — Artifact Storage ───────────────────────────────────────────────
  # Эмулирует S3-хранилище для артефактов Argo Workflows
  # API:     http://localhost:9000
  # Console: http://localhost:9001  (admin / minioadmin)
  minio:
    image: minio/minio:latest
    container_name: pipeline-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - pipeline-net

  # ── Spark Data Processor ───────────────────────────────────────────────────
  # Запускает ETL-джобу и завершается (oneshot)
  # Логи демонстрируют работу пайплайна
  spark-processor:
    build:
      context: ./apps/spark-jobs/data-processor
      dockerfile: Dockerfile
      target: runtime
    container_name: pipeline-spark-processor
    image: localhost:5000/spark-data-processor:latest
    environment:
      JOB_NAME: "demo-etl-job"
      INPUT_PATH: "/data/input"
      OUTPUT_PATH: "/data/output"
      USE_SPARK: "false"
    volumes:
      - ./data:/data
    depends_on:
      registry:
        condition: service_healthy
    restart: "no"   # runs once then exits
    networks:
      - pipeline-net

  # ── Data UI Dashboard ──────────────────────────────────────────────────────
  # Dashboard витрина для отображения данных
  # URL: http://localhost:8080
  data-ui:
    build:
      context: ./apps/dashboards/data-ui
      dockerfile: Dockerfile
      target: runtime
    container_name: pipeline-data-ui
    image: localhost:5000/data-ui:latest
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/health"]
      interval: 15s
      timeout: 3s
      retries: 3
    depends_on:
      registry:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - pipeline-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  registry_data:
  minio_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  pipeline-net:
    driver: bridge
