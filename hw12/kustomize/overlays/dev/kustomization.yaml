apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

bases:
  - ../../base

namespace: dev

namePrefix: dev-

commonLabels:
  env: dev

patches:
  - target:
      kind: Deployment
      name: data-ui
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: dev
      - op: replace
        path: /spec/template/spec/containers/0/image
        value: localhost:5000/data-ui:dev

configMapGenerator:
  - name: data-ui-config
    literals:
      - ENV=dev
      - LOG_LEVEL=debug
      - API_URL=http://argo-server.argo:2746
