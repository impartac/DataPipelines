# Helm values for MinIO (chart: minio/minio)
# https://github.com/minio/minio/tree/master/helm/minio
#
# Install:
#   helm repo add minio https://charts.min.io
#   helm upgrade --install minio minio/minio \
#     --namespace minio --create-namespace \
#     --values helm/third-party/minio/values.yaml

mode: standalone

rootUser: minioadmin
rootPassword: minioadmin   # use Kubernetes Secret in production

replicas: 1

persistence:
  enabled: true
  size: 10Gi

resources:
  requests:
    memory: 512Mi
    cpu: 250m
  limits:
    memory: 1Gi
    cpu: 500m

service:
  type: ClusterIP
  port: 9000

consoleService:
  type: LoadBalancer
  port: 9001

# Pre-create buckets on startup
buckets:
  - name: argo-artifacts
    policy: none
    purge: false
  - name: spark-output
    policy: none
    purge: false
